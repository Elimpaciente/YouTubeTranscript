<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube-transcript-extractor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .header p {
            font-size: 0.95em;
            opacity: 0.9;
        }
        .content {
            padding: 40px 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-group {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 0.95em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-copy {
            background: #28a745;
            color: white;
        }
        .btn-copy:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result {
            display: none;
            margin-top: 30px;
        }
        .result-header {
            background: #e8f5e9;
            border-left: 4px solid #28a745;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .result-header h3 {
            color: #2e7d32;
            font-size: 1em;
            margin-bottom: 10px;
        }
        .no-transcript {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .no-transcript h3 {
            color: #856404;
            font-size: 1em;
        }
        .transcript-box {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #333;
            font-size: 0.95em;
            white-space: pre-wrap;
        }
        .transcript-box::-webkit-scrollbar {
            width: 8px;
        }
        .transcript-box::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .transcript-box::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            border-radius: 6px;
            color: #721c24;
            display: none;
            margin-bottom: 20px;
        }
        .copy-feedback {
            color: #28a745;
            font-size: 0.85em;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>youtube-transcript-extractor</h1>
            <p style="font-size: 0.85em; margin-top: 12px; opacity: 0.85;">Created by Rudy</p>
            <p>Extract transcripts from YouTube videos in seconds</p>
        </div>
        <div class="content">
            <div class="error" id="errorMsg"></div>
            <div id="formSection">
                <div class="form-group">
                    <input 
                        type="text" 
                        id="youtubeUrl" 
                        placeholder="Enter the YouTube Video URL - Note: Not all videos can be transcribed, but most can"
                    >
                </div>
                <div class="btn-group">
                    <button class="btn-primary" id="transcribeBtn" onclick="transcribeVideo()">
                        Transcribe Video
                    </button>
                    <button class="btn-primary" id="summarizeBtn" onclick="summarizeVideo()">
                        Summarize Video
                    </button>
                </div>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Transcribing video, please wait...</p>
            </div>
            <div class="result" id="result">
                <div class="result-header" id="resultHeader">
                    <h3>Transcript Ready</h3>
                </div>
                <div class="no-transcript" id="noTranscript" style="display: none;">
                    <h3>Transcript not available</h3>
                </div>
                <button class="btn-copy" id="copyBtn" onclick="copyTranscript()" style="width: 100%; margin-bottom: 20px;">Copy Transcript</button>
                <div class="copy-feedback" id="copyFeedback">Copied to clipboard!</div>
                <div class="transcript-box" id="transcriptText"></div>
            </div>
        </div>
    </div>
    <script>
        const TRANSCRIPT_API = 'https://yt-transcript.apisimpacientes.workers.dev/transcript?url=';
        const SUMMARIZER_API = 'https://youtube-summarizer.apisimpacientes.workers.dev/summarize?url=';
        function getYouTubeUrl() {
            const input = document.getElementById('youtubeUrl').value.trim();
            if (!input) {
                showError('Please enter a YouTube URL');
                return null;
            }
            let videoUrl = input;
            if (!videoUrl.startsWith('http')) {
                videoUrl = 'https://' + videoUrl;
            }
            try {
                new URL(videoUrl);
                return encodeURIComponent(videoUrl);
            } catch (e) {
                showError('Please enter a valid YouTube URL');
                return null;
            }
        }
        async function transcribeVideo() {
            clearError();
            const encodedUrl = getYouTubeUrl();
            if (!encodedUrl) return;
            document.getElementById('result').style.display = 'none';
            document.getElementById('youtubeUrl').value = '';
            const btn = document.getElementById('transcribeBtn');
            btn.disabled = true;
            document.getElementById('loading').querySelector('p').textContent = 'Transcribing video, please wait...';
            document.getElementById('loading').style.display = 'block';
            try {
                const response = await fetch(TRANSCRIPT_API + encodedUrl);
                const data = await response.json();
                if (data.success && data.transcript) {
                    displayTranscript(data.transcript, 'Transcript Ready');
                } else {
                    displayNoTranscript(data.message || 'Transcript not available');
                }
            } catch (error) {
                showError('Error: ' + error.message + '. Please check the URL and try again.');
            } finally {
                document.getElementById('loading').style.display = 'none';
                btn.disabled = false;
            }
        }
        async function summarizeVideo() {
            clearError();
            const encodedUrl = getYouTubeUrl();
            if (!encodedUrl) return;
            document.getElementById('result').style.display = 'none';
            document.getElementById('youtubeUrl').value = '';
            const btn = document.getElementById('summarizeBtn');
            btn.disabled = true;
            document.getElementById('loading').querySelector('p').textContent = 'Generating summary, please wait...';
            document.getElementById('loading').style.display = 'block';
            try {
                const response = await fetch(SUMMARIZER_API + encodedUrl + '&language=english');
                const data = await response.json();
                if (data.success && data.summary) {
                    displayTranscript(data.summary, 'Summary Ready');
                } else {
                    displayNoTranscript(data.message || 'Summary not available');
                }
            } catch (error) {
                showError('Error: ' + error.message + '. Please check the URL and try again.');
            } finally {
                document.getElementById('loading').style.display = 'none';
                btn.disabled = false;
            }
        }
        function displayTranscript(text, headerText) {
            document.getElementById('transcriptText').textContent = text;
            document.getElementById('transcriptText').style.display = 'block';
            document.getElementById('resultHeader').querySelector('h3').textContent = headerText;
            document.getElementById('resultHeader').style.display = 'block';
            document.getElementById('noTranscript').style.display = 'none';
            document.getElementById('copyBtn').style.display = 'block';
            document.getElementById('result').style.display = 'block';
            document.getElementById('transcriptText').scrollTop = 0;
        }
        function displayNoTranscript(message) {
            document.getElementById('transcriptText').style.display = 'none';
            document.getElementById('resultHeader').style.display = 'none';
            const noTranscriptDiv = document.getElementById('noTranscript');
            noTranscriptDiv.querySelector('h3').textContent = message || 'Transcript not available';
            noTranscriptDiv.style.display = 'block';
            document.getElementById('copyBtn').style.display = 'none';
            document.getElementById('result').style.display = 'block';
        }
        function copyTranscript() {
            const transcript = document.getElementById('transcriptText').textContent;
            navigator.clipboard.writeText(transcript).then(function() {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.display = 'block';
                setTimeout(function() {
                    feedback.style.display = 'none';
                }, 2000);
            }).catch(function() {
                showError('Failed to copy transcript');
            });
        }
        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        function clearError() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('errorMsg').textContent = '';
        }
        document.getElementById('youtubeUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                transcribeVideo();
            }
        });
    </script>
</body>
</html>
